[project]
name = "retinal-age-factors"
version = "0.1.0"
description = "RETFound DINOv2 retinal age gap pipeline for the CUTI teleretinal diabetes cohort"
requires-python = ">=3.12"
# Versions of the environment that produced the reference run.
# scikit-learn must stay at 1.7.2: StratifiedGroupKFold assigns different folds in 1.9.
dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scipy==1.17.1",
    "scikit-learn==1.7.2",
    "statsmodels==0.14.6",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "timm==1.0.26",
    "huggingface-hub==1.7.2",
    "pillow==12.1.1",
    "pydicom==3.0.2",
    "openpyxl==3.1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
